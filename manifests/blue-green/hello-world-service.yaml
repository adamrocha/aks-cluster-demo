apiVersion: v1
kind: Service
metadata:
  name: hello-world-service
  namespace: hello-world-ns
  labels:
    app: hello-world
spec:
  type: LoadBalancer
  selector:
    app: hello-world
    version: blue  # Start with blue by default
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
    name: http
